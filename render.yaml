# Blueprint do Render — Ascension Infinite (servidor oficial)
services:
  - type: web
    name: ascension-infinite
    runtime: node
    # free: dorme após 15 min sem acesso e apaga contas/IAs a cada reinício.
    # starter + disco: dados permanentes (descomente o bloco disk e troque DATA_DIR).
    plan: free
    buildCommand: npm install --no-audit --no-fund
    startCommand: node server.mjs
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATA_DIR
        value: ./data
      # assina os backups locais (gerado pelo Render uma vez e mantido entre deploys)
      - key: SAVE_SECRET
        generateValue: true
      # 1 = o save do aparelho é aceito ao entrar (save unificado online/offline); 0 = modo estrito
      - key: TRUST_LOCAL_SAVES
        value: "1"
      # - key: DATA_DIR
      #   value: /var/data
